<!doctype html><html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Hanken+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#faf8f4;font-family:"Hanken Grotesk",sans-serif;overflow:hidden;position:relative}
.ring{position:absolute;width:680px;height:680px;border:90px solid #f6ebe2;border-radius:50%;right:-260px;top:-150px}
.pad{position:relative;padding:74px 80px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:18px}
.mark{width:64px;height:64px}
.wm{font-family:"Fraunces",serif;font-weight:700;font-size:44px;color:#14181f;letter-spacing:-.02em}
.by{color:#8a8276;font-size:22px;font-weight:600;margin-left:6px}
.eyebrow{color:#8f4a22;font-weight:700;font-size:24px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:18px}
h1{font-family:"Fraunces",serif;font-weight:600;font-size:74px;line-height:1.06;color:#14181f;letter-spacing:-.015em;max-width:18ch}
h1 em{font-style:italic;color:#bf6b3c}
.foot{display:flex;align-items:center;gap:16px;color:#665f54;font-size:26px;font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:#bf6b3c}
</style></head>
<body>
<div class="ring"></div>
<div class="pad">
  <div class="top">
    <svg class="mark" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="#bf6b3c" stroke-width="9"/><circle cx="32" cy="32" r="13" fill="none" stroke="#14181f" stroke-width="3"/><g fill="#14181f"><rect x="29" y="2" width="6" height="14" rx="3"/><rect x="29" y="48" width="6" height="14" rx="3"/><rect x="2" y="29" width="14" height="6" rx="3"/><rect x="48" y="29" width="14" height="6" rx="3"/></g></svg>
    <span class="wm">ShipSafe</span><span class="by">by Copper Bay Labs</span>
  </div>
  <div>
    <p class="eyebrow">Accessibility &amp; privacy risk check</p>
    <h1>Is your site one scan away from a <em>demand letter?</em></h1>
  </div>
  <div class="foot">Free &nbsp;<span class="dot"></span>&nbsp; no signup &nbsp;<span class="dot"></span>&nbsp; 10-second ADA &amp; privacy report</div>
</div>
</body></html>
